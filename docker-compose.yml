version: '3.8'

services:
  pngnav-gazebo:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pngnav-simulation
    image: pngnav:ros2-gazebo

    # Use host network for reliable ROS2 discovery on Docker Desktop
    network_mode: host
    privileged: true

    # GPU Configuration for PyTorch/CUDA
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [ gpu ]

    environment:
      # --- Display & UI ---
      # host.docker.internal works best for VcXsrv/GWSL on Windows
      - DISPLAY=host.docker.internal:0.0
      - QT_X11_NO_MITSHM=1

      # --- ROS2 Settings ---
      - TURTLEBOT3_MODEL=waffle_pi
      - ROS_DOMAIN_ID=0
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - ROS_LOCALHOST_ONLY=0

      # --- Gazebo Pathing & Stability ---
      # Disables the online model check that causes hangs
      - GAZEBO_MODEL_DATABASE_URI=
      # Includes TurtleBot3 models, local simulation models, and system models
      - GAZEBO_MODEL_PATH=/workspace/PNGNav/src/png_navigation/models:/opt/ros/humble/share/turtlebot3_gazebo/models:/usr/share/gazebo-11/models
      - GAZEBO_RESOURCE_PATH=/usr/share/gazebo-11

      # --- NVIDIA Graphics ---
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=all,graphics,utility,compute

    volumes:
      # Mount the project directory so code changes reflect immediately
      - ./:/workspace/PNGNav
      # Persist the conda environment across container restarts
      - conda-env:/opt/conda/envs
      # X11 Unix socket (Standard for Linux, doesn't hurt on Windows)
      - /tmp/.X11-unix:/tmp/.X11-unix:rw

    # Increase shared memory size (Crucial for Gazebo sensor data/Lidar)
    shm_size: '2gb'

    stdin_open: true
    tty: true

    # Default entry point is the script defined in your Dockerfile
    command: /bin/bash

volumes:
  conda-env:
