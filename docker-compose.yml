version: '3.8'

services:
  pngnav-gazebo:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pngnav-simulation
    image: pngnav:ros2-gazebo
    # Note: network_mode: host may not work on Windows Docker Desktop
    # If ROS2 communication fails, remove this line and expose ports manually
    network_mode: host
    privileged: true
    environment:
      # Windows X11 forwarding - using Wi-Fi adapter IP
      # If this doesn't work, try: host.docker.internal:0.0
      - DISPLAY=192.168.1.7:0.0
      - QT_X11_NO_MITSHM=1
      - TURTLEBOT3_MODEL=waffle_pi
      - ROS_DOMAIN_ID=0
      # Fix ROS2 discovery issues on Docker Desktop (multicast problems):
      # Force DDS to use localhost only, and use CycloneDDS (more reliable in containers).
      - ROS_LOCALHOST_ONLY=1
      - RMW_IMPLEMENTATION=rmw_cyclonedds_cpp
      - GAZEBO_MODEL_PATH=/opt/ros/humble/share/turtlebot3_gazebo/models
    volumes:
      # X11 socket mount (Linux only - not needed for Windows)
      # - /tmp/.X11-unix:/tmp/.X11-unix:rw
      # Mount the workspace for code changes
      - ./:/workspace/PNGNav
      # Persist conda environment (optional, for faster rebuilds)
      - conda-env:/opt/conda/envs
    devices:
      # Allow access to GPU if available (for neural network)
      - /dev/dri:/dev/dri
    stdin_open: true
    tty: true
    command: /bin/bash

volumes:
  conda-env:
